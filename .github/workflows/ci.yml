name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_key_000000
  NEXT_PUBLIC_SITE_URL: https://meucesto.example.com
  EMAIL_PROVIDER: disabled
  EMAIL_FROM: Meu Cesto <noreply@meucesto.example.com>
  OPENFOODFACTS_USER_AGENT: MeuCesto/1.0 (meucesto@webmails.org)
  RATE_LIMIT_HASH_SECRET: ci-only-secret-with-at-least-32-characters
  VERSION_BASE_REF: origin/main

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@12.4.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm version:verify
      - run: pnpm verify:schema
      - run: pnpm verify:security
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@12.4.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:start
      - run: pnpm supabase:reset
      - run: pnpm test:db
      - if: always()
        run: pnpm supabase:stop
